    // --- Web Audio API Procedural SFX ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, gainVal = 0.1) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }

      click() {
        this.playTone(800, 'sine', 0.08, 0.08);
      }

      success() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          setTimeout(() => {
            this.playTone(freq, 'triangle', 0.25, 0.12);
          }, i * 90);
        });
      }

      alert() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        this.playTone(220, 'sawtooth', 0.3, 0.15);
        setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.15), 120);
      }

      whoosh() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        this.playTone(320, 'sine', 0.2, 0.09);
        setTimeout(() => this.playTone(480, 'sine', 0.25, 0.07), 80);
      }
    }

    // ==============================================================
    // 1. ERD RELATION DESIGNER MODULE
    // ==============================================================
    function ErdDesignerModule({ onMissionComplete, showNotification }) {
      const [tables, setTables] = useState(INITIAL_ERD_TABLES);
      
      // Saved connections: Array of { id, sourceTable, sourceCol, targetTable, targetCol, isValid, relationType, message }
      const [connections, setConnections] = useState([
        // Initial clean state with no active relations, or empty to let student drag!
      ]);

      // Active dragging connection state
      const [dragState, setDragState] = useState(null); 
      // { fromTable, fromCol, isPK, currentX, currentY }

      // Dragging table card position
      const [movingTable, setMovingTable] = useState(null); // { tableId, offsetX, offsetY }

      // Preview Data Table Modal
      const [previewTable, setPreviewTable] = useState(null);

      // SVG Canvas Ref for coordinate transformation
      const svgRef = useRef(null);
      const canvasContainerRef = useRef(null);

      // Handle Port MouseDown (Start drawing relation line)
      const handlePortMouseDown = (e, tableId, col) => {
        e.stopPropagation();
        e.preventDefault();
        sfx.click();

        const canvasRect = canvasContainerRef.current.getBoundingClientRect();
        const startX = e.clientX - canvasRect.left;
        const startY = e.clientY - canvasRect.top;

        setDragState({
          fromTable: tableId,
          fromCol: col.name,
          isPK: col.isPK,
          isFK: col.isFK,
          currentX: startX,
          currentY: startY,
        });
      };

      // Handle Global MouseMove on Canvas
      const handleMouseMove = (e) => {
        if (dragState) {
          const canvasRect = canvasContainerRef.current.getBoundingClientRect();
          setDragState(prev => ({
            ...prev,
            currentX: e.clientX - canvasRect.left,
            currentY: e.clientY - canvasRect.top,
          }));
        } else if (movingTable) {
          const canvasRect = canvasContainerRef.current.getBoundingClientRect();
          const newX = Math.max(10, Math.min(800, e.clientX - canvasRect.left - movingTable.offsetX));
          const newY = Math.max(10, Math.min(700, e.clientY - canvasRect.top - movingTable.offsetY));
          
          setTables(prev => prev.map(t => t.id === movingTable.tableId ? { ...t, x: newX, y: newY } : t));
        }
      };

      // Handle Port MouseUp (Establish connection)
      const handlePortMouseUp = (e, targetTableId, targetCol) => {
        e.stopPropagation();
        if (!dragState) return;

        const srcTable = dragState.fromTable;
        const srcCol = dragState.fromCol;

        // Validation Rules:
        // Rule A: Kelas.id_kelas (PK) <-> Siswa.id_kelas (FK) => VALID 1-to-Many!
        // Rule B: Wali_Kelas.id_wali (PK) <-> Kelas.id_wali (FK) => VALID 1-to-1!
        const isSelfTable = srcTable === targetTableId;
        
        let isValid = false;
        let relationType = '';
        let message = '';

        if (isSelfTable) {
          isValid = false;
          message = 'Relasi tidak boleh menghubungkan kolom di tabel yang sama!';
        } else if (
          (srcTable === 'kelas' && srcCol === 'id_kelas' && targetTableId === 'siswa' && targetCol.name === 'id_kelas') ||
          (srcTable === 'siswa' && srcCol === 'id_kelas' && targetTableId === 'kelas' && targetCol.name === 'id_kelas')
        ) {
          isValid = true;
          relationType = '1 : N (One to Many)';
          message = 'Tepat sekali! 1 Kelas dapat memiliki banyak Siswa (Relasi 1-to-Many).';
        } else if (
          (srcTable === 'wali_kelas' && srcCol === 'id_wali' && targetTableId === 'kelas' && targetCol.name === 'id_wali') ||
          (srcTable === 'kelas' && srcCol === 'id_wali' && targetTableId === 'wali_kelas' && targetCol.name === 'id_wali')
        ) {
          isValid = true;
          relationType = '1 : 1 (One to One)';
          message = 'Bagus! 1 Wali Kelas membimbing tepat 1 Kelas tertentu.';
        } else {
          isValid = false;
          message = `Ups! Kolom '${srcCol}' dan '${targetCol.name}' tidak memiliki relasi Foreign Key yang valid. Pastikan Primary Key (PK) dihubungkan dengan Foreign Key (FK) yang tepat!`;
        }

        const newConn = {
          id: `${srcTable}_${srcCol}__${targetTableId}_${targetCol.name}_${Date.now()}`,
          sourceTable: srcTable,
          sourceCol: srcCol,
          targetTable: targetTableId,
          targetCol: targetCol.name,
          isValid,
          relationType,
          message
        };

        // Replace or add
        setConnections(prev => [...prev.filter(c => 
          !(c.sourceTable === srcTable && c.sourceCol === srcCol && c.targetTable === targetTableId && c.targetCol === targetCol.name)
        ), newConn]);

        setDragState(null);

        if (isValid) {
          sfx.success();
          showNotification('Relasi Basis Data Valid! ✅', message, 'success');
          onMissionComplete();
        } else {
          sfx.alert();
          showNotification('Relasi Tidak Sesuai ⚠️', message, 'error');
        }
      };

      // Handle Cancel Drag
      const handleMouseUp = () => {
        if (dragState) {
          setDragState(null);
        }
        if (movingTable) {
          setMovingTable(null);
        }
      };

      // Helper to calculate port anchor coordinates
      const getPortCoordinates = (tableId, colName) => {
        const table = tables.find(t => t.id === tableId);
        if (!table) return { x: 0, y: 0 };
        
        const colIndex = table.columns.findIndex(c => c.name === colName);
        // Table width is 260px, header height ~ 48px, row height ~ 36px
        const portY = table.y + 54 + (colIndex * 34) + 12;
        // PK on left side or FK on right side
        const portX = table.x + 258; // right edge anchor
        return { x: portX, y: portY };
      };

      const getSourceCoordinates = (tableId, colName) => {
        const table = tables.find(t => t.id === tableId);
        if (!table) return { x: 0, y: 0 };
        const colIndex = table.columns.findIndex(c => c.name === colName);
        return {
          x: table.x + 258,
          y: table.y + 54 + (colIndex * 34) + 12
        };
      };

      const getTargetCoordinates = (tableId, colName) => {
        const table = tables.find(t => t.id === tableId);
        if (!table) return { x: 0, y: 0 };
        const colIndex = table.columns.findIndex(c => c.name === colName);
        return {
          x: table.x + 2,
          y: table.y + 54 + (colIndex * 34) + 12
        };
      };

      const deleteConnection = (id) => {
        sfx.click();
        setConnections(prev => prev.filter(c => c.id !== id));
      };

      const autoHintConnection = () => {
        sfx.whoosh();
        // Give student the solution if they get stuck
        const validConn = {
          id: `kelas_id_kelas__siswa_id_kelas_${Date.now()}`,
          sourceTable: 'kelas',
          sourceCol: 'id_kelas',
          targetTable: 'siswa',
          targetCol: 'id_kelas',
          isValid: true,
          relationType: '1 : N (One to Many)',
          message: 'Relasi Kelas (PK: id_kelas) ke Siswa (FK: id_kelas) berhasil terhubung otomatis!'
        };
        setConnections(prev => [...prev.filter(c => !(c.sourceTable === 'kelas' && c.targetTable === 'siswa')), validConn]);
        showNotification('Bantuan Relasi Diterapkan!', 'Garis hijau menghubungkan id_kelas di Tabel Kelas ke id_kelas di Tabel Siswa.', 'success');
        onMissionComplete();
      };

      return (
        <div className="flex flex-col gap-4">
          
          {/* Module Header & Instructions */}
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-slate-900/90 border border-slate-800 p-4 rounded-2xl">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-lg bg-cyan-950 text-cyan-400 border border-cyan-800/60 font-mono text-xs">
                  MODUL 1
                </span>
                <h2 className="text-base font-bold text-white">Visual ERD (Entity Relationship Diagram) Designer</h2>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                Tarik garis dari titik kolom <strong>Primary Key (🔑 PK)</strong> ke kolom <strong>Foreign Key (🔗 FK)</strong> untuk menghubungkan tabel. Geser kartu tabel untuk menata tata letak.
              </p>
            </div>

            <div className="flex items-center gap-2 w-full sm:w-auto">
              <button
                onClick={autoHintConnection}
                className="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl bg-cyan-950/70 hover:bg-cyan-900/80 text-cyan-300 border border-cyan-700/60 text-xs font-semibold transition"
              >
                <span>✨</span>
                <span>Beri Petunjuk Relasi</span>
              </button>
              <button
                onClick={() => { setConnections([]); sfx.click(); }}
                className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition"
              >
                Reset Garis
              </button>
            </div>
          </div>

          {/* Canvas Workspace */}
          <div 
            ref={canvasContainerRef}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            className="relative w-full h-[620px] bg-[#090d18] cyber-grid rounded-2xl border border-slate-800/90 overflow-hidden shadow-inner select-none"
          >
            {/* Background Canvas Guide Watermark */}
            <div className="absolute top-4 right-4 z-0 pointer-events-none text-right opacity-30">
              <p className="font-mono text-[10px] text-cyan-400 tracking-wider">CANVAS COORDINATES: [X: 840, Y: 620]</p>
              <p className="font-mono text-[9px] text-slate-500">ENGINE: SVG REALTIME BEZIER VECTOR</p>
            </div>

            {/* SVG Layer for Drawing Interactive Connection Lines */}
            <svg 
              ref={svgRef}
              className="absolute inset-0 w-full h-full pointer-events-none z-10"
            >
              <defs>
                {/* Glow filter for green relation */}
                <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="0" stdDeviation="3" floodColor="#10b981" floodOpacity="0.8"/>
                </filter>
                <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="0" stdDeviation="3" floodColor="#f43f5e" floodOpacity="0.8"/>
                </filter>
              </defs>

              {/* Render Existing Connections */}
              {connections.map((conn) => {
                const src = getSourceCoordinates(conn.sourceTable, conn.sourceCol);
                const tgt = getTargetCoordinates(conn.targetTable, conn.targetCol);
                
                // Bezier curve control points
                const dx = Math.abs(tgt.x - src.x) * 0.5;
                const pathData = `M ${src.x} ${src.y} C ${src.x + dx} ${src.y}, ${tgt.x - dx} ${tgt.y}, ${tgt.x} ${tgt.y}`;
                const midX = (src.x + tgt.x) / 2;
                const midY = (src.y + tgt.y) / 2;

                return (
                  <g key={conn.id} className="cursor-pointer pointer-events-auto">
                    {/* Shadow / Glow Line */}
                    <path
                      d={pathData}
                      fill="none"
                      stroke={conn.isValid ? '#10b981' : '#f43f5e'}
                      strokeWidth={conn.isValid ? "3" : "2"}
                      strokeDasharray={conn.isValid ? "6 3" : "4 4"}
                      className={conn.isValid ? "animate-dash-flow" : ""}
                      filter={conn.isValid ? "url(#glow-green)" : "url(#glow-red)"}
                    />

                    {/* Animated data pulses if valid */}
                    {conn.isValid && (
                      <circle r="4" fill="#34d399">
                        <animateMotion path={pathData} dur="2s" repeatCount="indefinite" />
                      </circle>
                    )}

                    {/* Central Badge on Line */}
                    <g

            {/* Draggable Table Cards */}

                    onClick={() => setPreviewTable(null)}

    // ==============================================================
    // 2. VISUAL QUERY BUILDER MODULE
    // ==============================================================
    function VisualQueryBuilderModule({ onMissionComplete, showNotification }) {
      const [data, setData] = useState(SAMPLE_STUDENTS_DATA);
      
      // Filter 1 State
      const [filterCol, setFilterCol] = useState('jurusan');
      const [filterOp, setFilterOp] = useState('=');
      const [filterValNum, setFilterValNum] = useState(75);
      const [filterValStr, setFilterValStr] = useState('RPL');

      // Filter 2 State (Optional AND condition)
      const [enableSecondFilter, setEnableSecondFilter] = useState(false);
      const [filter2Col, setFilter2Col] = useState('nilai');
      const [filter2Op, setFilter2Op] = useState('>');
      const [filter2ValNum, setFilter2ValNum] = useState(75);

      // Sorting
      const [sortBy, setSortBy] = useState('none'); // 'none', 'nilai_desc', 'nilai_asc', 'nama_asc'

      // Field Visibility (SELECT columns)
      const [visibleCols, setVisibleCols] = useState({
        id: true,
        nisn: true,
        nama: true,
        jurusan: true,
        nilai: true,
        kehadiran: true,
        status: true,
      });

      // Filter Execution Status
      const [hasExecuted, setHasExecuted] = useState(false);
      const [matchedIds, setMatchedIds] = useState(data.map(d => d.id));
      const [isScanning, setIsScanning] = useState(false);

      // Execute Filter
      const runQuery = () => {
        sfx.whoosh();
        setIsScanning(true);

        setTimeout(() => {
          setIsScanning(false);
          setHasExecuted(true);

          const matches = data.filter(item => {
            // Check condition 1
            let match1 = false;
            if (filterCol === 'jurusan') {
              match1 = filterOp === '=' ? item.jurusan === filterValStr : item.jurusan !== filterValStr;
            } else if (filterCol === 'status') {
              match1 = filterOp === '=' ? item.status === filterValStr : item.status !== filterValStr;
            } else if (filterCol === 'nilai') {
              const val = Number(filterValNum);
              if (filterOp === '>') match1 = item.nilai > val;
              else if (filterOp === '>=') match1 = item.nilai >= val;
              else if (filterOp === '<') match1 = item.nilai < val;
              else if (filterOp === '=') match1 = item.nilai === val;
              else if (filterOp === '!=') match1 = item.nilai !== val;
            } else if (filterCol === 'kehadiran') {
              const val = Number(filterValNum);
              if (filterOp === '>') match1 = item.kehadiran > val;
              else if (filterOp === '>=') match1 = item.kehadiran >= val;
              else if (filterOp === '<') match1 = item.kehadiran < val;
              else if (filterOp === '=') match1 = item.kehadiran === val;
            }

            // Check condition 2 if enabled
            if (!enableSecondFilter) return match1;

            let match2 = false;
            if (filter2Col === 'nilai') {
              const val = Number(filter2ValNum);
              if (filter2Op === '>') match2 = item.nilai > val;
              else if (filter2Op === '>=') match2 = item.nilai >= val;
              else if (filter2Op === '<') match2 = item.nilai < val;
              else if (filter2Op === '=') match2 = item.nilai === val;
            } else if (filter2Col === 'kehadiran') {
              const val = Number(filter2ValNum);
              if (filter2Op === '>') match2 = item.kehadiran > val;
              else if (filter2Op === '<') match2 = item.kehadiran < val;
            }

            return match1 && match2;
          });

          const ids = matches.map(m => m.id);
          setMatchedIds(ids);

          // Check if Mission 2 completed: Jurusan RPL & Nilai > 75 (either as filter 1 or composite)
          const isRplFiltered = (filterCol === 'jurusan' && filterValStr === 'RPL') || (enableSecondFilter && filter2Col === 'jurusan');
          const isNilaiFiltered = (filterCol === 'nilai' && (filterOp === '>' || filterOp === '>=') && filterValNum >= 75) ||
                                  (enableSecondFilter && filter2Col === 'nilai' && (filter2Op === '>' || filter2Op === '>=') && filter2ValNum >= 70);

          if (isRplFiltered && isNilaiFiltered) {
            onMissionComplete();
          } else {
            sfx.success();
            showNotification('Query Berhasil Dijalankan!', `Ditemukan ${ids.length} dari ${data.length} baris yang cocok dengan kriteria visualmu.`, 'success');
          }

        }, 400);
      };

      const resetFilter = () => {
        sfx.click();
        setFilterCol('jurusan');
        setFilterOp('=');
        setFilterValStr('RPL');
        setFilterValNum(75);
        setEnableSecondFilter(false);
        setHasExecuted(false);
        setMatchedIds(data.map(d => d.id));
        setSortBy('none');
      };

      // Auto-set preset for Mission 2
      const setMission2Preset = () => {
        sfx.whoosh();
        setFilterCol('jurusan');
        setFilterOp('=');
        setFilterValStr('RPL');
        setEnableSecondFilter(true);
        setFilter2Col('nilai');
        setFilter2Op('>');
        setFilter2ValNum(75);
        showNotification('Preset Misi 2 Dipasang!', 'Klik tombol [JALANKAN FILTER] untuk mengeksekusi penyaringan data.', 'success');
      };

      // Process Sorting
      const sortedData = useMemo(() => {
        let list = [...data];
        if (sortBy === 'nilai_desc') list.sort((a, b) => b.nilai - a.nilai);
        else if (sortBy === 'nilai_asc') list.sort((a, b) => a.nilai - b.nilai);
        else if (sortBy === 'nama_asc') list.sort((a, b) => a.nama.localeCompare(b.nama));
        return list;
      }, [data, sortBy]);

      // Generated Visual SQL representation
      const generatedSql = useMemo(() => {
        const selectedColumns = Object.keys(visibleCols).filter(k => visibleCols[k]).join(', ');
        let whereClause = '';
        if (filterCol === 'jurusan' || filterCol === 'status') {
          whereClause += `${filterCol} ${filterOp} '${filterValStr}'`;
        } else {
          whereClause += `${filterCol} ${filterOp} ${filterValNum}`;
        }

        if (enableSecondFilter) {
          whereClause += ` AND ${filter2Col} ${filter2Op} ${filter2ValNum}`;
        }

        let orderClause = '';
        if (sortBy === 'nilai_desc') orderClause = ' ORDER BY nilai DESC';
        else if (sortBy === 'nilai_asc') orderClause = ' ORDER BY nilai ASC';
        else if (sortBy === 'nama_asc') orderClause = ' ORDER BY nama ASC';

        return `SELECT ${selectedColumns || '*'} \nFROM Siswa \nWHERE ${whereClause}${orderClause};`;
      }, [visibleCols, filterCol, filterOp, filterValStr, filterValNum, enableSecondFilter, filter2Col, filter2Op, filter2ValNum, sortBy]);

      return (
        <div className="flex flex-col gap-5">
          
          {/* Module Header */}
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-slate-900/90 border border-slate-800 p-4 rounded-2xl">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-lg bg-emerald-950 text-emerald-400 border border-emerald-800/60 font-mono text-xs">
                  MODUL 2
                </span>
                <h2 className="text-base font-bold text-white">Visual Query Builder & Data Inspector</h2>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                Atur kriteria filter menggunakan slider dan tombol visual. Baris yang tidak cocok akan <strong>memudar (fade out)</strong> dan data yang lolos akan <strong>disorot (highlight)</strong>.
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={setMission2Preset}
                className="px-3 py-1.5 rounded-xl bg-emerald-950/70 hover:bg-emerald-900/80 text-emerald-300 border border-emerald-700/60 text-xs font-semibold transition"
              >
                ✨ Atur Preset Misi 2
              </button>
              <button
                onClick={resetFilter}
                className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition"
              >
                ↺ Reset
              </button>
            </div>
          </div>

          {/* Interactive Control Center Panel */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
            
            {/* Left Controls: Filter Builder (5 cols) */}
            <div className="lg:col-span-5 bg-slate-900/95 border border-slate-800 p-5 rounded-2xl flex flex-col gap-4 shadow-xl">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <span className="text-xs font-bold font-mono tracking-wider text-cyan-400 uppercase flex items-center gap-1.5">
                  <span>🎛️</span> Kontrol Filter Data (WHERE)
                </span>
                <span className="text-[10px] text-slate-500 font-mono">STEP 1: ATUR KRITERIA</span>
              </div>

              {/* Filter 1 Block */}
              <div className="p-3.5 rounded-xl bg-slate-950/80 border border-slate-800 space-y-3">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-semibold text-slate-300">Kriteria Utama:</span>
                  <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800/50">
                    Kondisi 1
                  </span>
                </div>

                {/* Column Selection */}
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[10px] text-slate-400 font-medium">Pilih Kolom:</label>
                    <select
                      value={filterCol}
                      onChange={(e) => {
                        setFilterCol(e.target.value);
                        sfx.click();
                      }}
                      className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:ring-1 focus:ring-cyan-500 focus:outline-none"
                    >
                      <option value="jurusan">Jurusan Keahlian</option>
                      <option value="nilai">Nilai Akhir Siswa</option>
                      <option value="kehadiran">Kehadiran (%)</option>
                      <option value="status">Status Kelulusan</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-[10px] text-slate-400 font-medium">Operator:</label>
                    <select
                      value={filterOp}
                      onChange={(e) => {
                        setFilterOp(e.target.value);
                        sfx.click();
                      }}
                      className="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:ring-1 focus:ring-cyan-500 focus:outline-none"
                    >
                      <option value="=">Sama Dengan (=)</option>
                      <option value="!=">Tidak Sama (!=)</option>
                      {(filterCol === 'nilai' || filterCol === 'kehadiran') && (
                        <>
                          <option value=">">Lebih Dari (&gt;)</option>
                          <option value=">=">Lebih Dari Sama (&gt;=)</option>
                          <option value="<">Kurang Dari (&lt;)</option>
                        </>
                      )}
                    </select>
                  </div>
                </div>

                {/* Dynamic Value Input */}
                <div className="pt-1">
                  {(filterCol === 'jurusan') && (
                    <div className="space-y-1.5">
                      <label className="text-[10px] text-slate-400 font-medium">Pilih Jurusan:</label>
                      <div className="grid grid-cols-3 gap-2">
                        {['RPL', 'TKJ', 'DMM'].map(j => (
                          <button
                            key={j}
                            onClick={() => { setFilterValStr(j); sfx.click(); }}
                            className={`py-1.5 rounded-lg text-xs font-bold transition border ${
                              filterValStr === j
                                ? 'bg-cyan-600 border-cyan-400 text-white shadow-md shadow-cyan-600/30'
                                : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-white'
                            }`}
                          >
                            {j}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {(filterCol === 'status') && (
                    <div className="space-y-1.5">
                      <label className="text-[10px] text-slate-400 font-medium">Status Siswa:</label>
                      <div className="grid grid-cols-2 gap-2">
                        {['Lulus', 'Remidi'].map(s => (
                          <button
                            key={s}
                            onClick={() => { setFilterValStr(s); sfx.click(); }}
                            className={`py-1.5 rounded-lg text-xs font-bold transition border ${
                              filterValStr === s
                                ? 'bg-cyan-600 border-cyan-400 text-white shadow-md shadow-cyan-600/30'
                                : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-white'
                            }`}
                          >
                            {s}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {(filterCol === 'nilai' || filterCol === 'kehadiran') && (
                    <div className="space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <label className="text-[10px] text-slate-400 font-medium">
                          Batas Nilai / Angka:
                        </label>
                        <span className="font-mono font-bold text-cyan-400 bg-cyan-950 px-2 py-0.5 rounded border border-cyan-800 text-xs">
                          {filterValNum} {filterCol === 'kehadiran' ? '%' : 'Poin'}
                        </span>
                      </div>
                      <input
                        type="range"
                        min="50"
                        max="100"
                        step="1"
                        value={filterValNum}
                        onChange={(e) => setFilterValNum(e.target.value)}
                        className="w-full accent-cyan-400"
                      />
                      <div className="flex justify-between text-[9px] font-mono text-slate-500">
                        <span>Min: 50</span>
                        <span>KKM: 75</span>
                        <span>Max: 100</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* Optional Second Condition Toggle (AND filter) */}
              <div className="p-3.5 rounded-xl bg-slate-950/80 border border-slate-800 space-y-2.5">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-300">Filter Tambahan (AND):</span>
                  <button
                    onClick={() => {
                      setEnableSecondFilter(!enableSecondFilter);

      // Process Joined Results

        let results = [];

        if (joinType === 'inner') {
          // Only rows where peminjaman.id_siswa matches siswa.id_siswa
          TABLE_PEMINJAMAN.forEach(p => {
            const s = TABLE_DATA_SISWA.find(item => item.id_siswa === p.id_siswa);
            if (s) {
              results.push({
                id_pinjam: p.id_pinjam,
                id_siswa_pinjam: p.id_siswa,
                judul_buku: p.judul_buku,
                id_siswa_induk: s.id_siswa,
                nama_siswa: s.nama_siswa,
                kelas: s.kelas,
                status: 'matched'
              });
            }
          });
        } else if (joinType === 'left') {
          // All rows from Table Peminjaman + matching student or NULL
          TABLE_PEMINJAMAN.forEach(p => {
            const s = TABLE_DATA_SISWA.find(item => item.id_siswa === p.id_siswa);
            results.push({
              id_pinjam: p.id_pinjam,
              id_siswa_pinjam: p.id_siswa,
              judul_buku: p.judul_buku,
              id_siswa_induk: s ? s.id_siswa : 'NULL',
              nama_siswa: s ? s.nama_siswa : 'NULL (Siswa Tidak Terdaftar)',
              kelas: s ? s.kelas : 'NULL',
              status: s ? 'matched' : 'left_only'
            });
          });
        } else if (joinType === 'right') {
          // All rows from Table Data Siswa + matching loans or NULL
          TABLE_DATA_SISWA.forEach(s => {
            const loans = TABLE_PEMINJAMAN.filter(p => p.id_siswa === s.id_siswa);
            if (loans.length > 0) {
              loans.forEach(p => {
                results.push({
                  id_pinjam: p.id_pinjam,
                  id_siswa_pinjam: p.id_siswa,
                  judul_buku: p.judul_buku,
                  id_siswa_induk: s.id_siswa,
                  nama_siswa: s.nama_siswa,
                  kelas: s.kelas,
                  status: 'matched'
                });
              });
            } else {
              results.push({
                id_pinjam: 'NULL',
                id_siswa_pinjam: 'NULL',
                judul_buku: 'NULL (Belum Pernah Meminjam)',
                id_siswa_induk: s.id_siswa,
                nama_siswa: s.nama_siswa,
                kelas: s.kelas,
                status: 'right_only'
              });
            }
          });
        }

        return results;
      }, [joinType]);

                {/* Table A: Peminjaman Buku */}
                <div className="bg-slate-900/90 border border-cyan-500/30 rounded-2xl overflow-hidden shadow-lg">
                  <div className="px-4 py-2.5 bg-cyan-950/60 border-b border-cyan-500/30 flex items-center justify-between text-xs font-bold text-cyan-300">
                    <span>📘 Tabel A: Peminjaman_Buku</span>
                    <span className="font-mono text-[10px] text-cyan-400">Primary Table</span>
                  </div>
                  <div className="p-3 overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400 text-[10px]">
                          <th className="p-1.5">id_pinjam</th>
                          <th className="p-1.5 text-cyan-400">id_siswa (FK)</th>
                          <th className="p-1.5">judul_buku</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/40">
                        {TABLE_PEMINJAMAN.map(p => (
                          <tr key={p.id_pinjam} className="hover:bg-slate-800/30">
                            <td className="p-1.5 text-slate-400">{p.id_pinjam}</td>
                            <td className="p-1.5 font-bold text-cyan-300 bg-cyan-950/40">{p.id_siswa}</td>
                            <td className="p-1.5 text-slate-200 truncate max-w-[140px]">{p.judul_buku}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Table B: Data Siswa */}
                <div className="bg-slate-900/90 border border-violet-500/30 rounded-2xl overflow-hidden shadow-lg">
                  <div className="px-4 py-2.5 bg-violet-950/60 border-b border-violet-500/30 flex items-center justify-between text-xs font-bold text-violet-300">
                    <span>👨‍🎓 Tabel B: Data_Siswa</span>
                    <span className="font-mono text-[10px] text-violet-400">Reference Table</span>
                  </div>
                  <div className="p-3 overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400 text-[10px]">
                          <th className="p-1.5 text-violet-400">id_siswa (PK)</th>
                          <th className="p-1.5">nama_siswa</th>
                          <th className="p-1.5">kelas</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/40">
                        {TABLE_DATA_SISWA.map(s => (
                          <tr key={s.id_siswa} className="hover:bg-slate-800/30">
                            <td className="p-1.5 font-bold text-violet-300 bg-violet-950/40">{s.id_siswa}</td>
                            <td className="p-1.5 text-slate-200">{s.nama_siswa}</td>
                            <td className="p-1.5 text-slate-400">{s.kelas}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

              {/* Combined Result Table After JOIN */}
              <div className="bg-slate-900/95 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                <div className="px-5 py-3 bg-slate-950 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <span className="text-emerald-400 font-bold text-sm">✨ Hasil Penggabungan (Joined Output Result):</span>
                    <span className="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800 text-xs font-mono">
                      {joinType.toUpperCase()}
                    </span>
                  </div>
                  <span className="text-xs font-mono text-slate-400">
                    {joinedData.length} Baris Terkombinasi
                  </span>
                </div>

                <div className="p-4 overflow-x-auto">
                  <table className="w-full text-left text-xs font-mono">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400 uppercase text-[10px] bg-slate-950/50">
                        <th className="p-2.5 text-cyan-400">id_pinjam</th>
                        <th className="p-2.5 text-cyan-400">Buku Dipinjam</th>
                        <th className="p-2.5 text-amber-400">Kunci Relasi (id_siswa)</th>
                        <th className="p-2.5 text-violet-400">Nama Siswa</th>
                        <th className="p-2.5 text-violet-400">Kelas</th>
                        <th className="p-2.5 text-right">Status Baris</th>
                      </tr>
                    </thead>
                    <tbody className={`divide-y divide-slate-800/60 transition-opacity duration-300 ${isMerging ? 'opacity-30' : 'opacity-100'}`}>
                      {joinedData.map((row, idx) => (
                        <tr 
                          key={idx}
                          className={`hover:bg-slate-800/40 ${
                            row.status === 'matched' 
                              ? 'bg-slate-900/40' 
                              : 'bg-amber-950/10'
                          }`}
                        >
                          <td className="p-2.5 font-bold text-cyan-300">{row.id_pinjam}</td>
                          <td className="p-2.5 text-slate-200">{row.judul_buku}</td>
                          <td className="p-2.5 font-bold text-amber-400 bg-amber-950/20">
                            {row.id_siswa_pinjam} ➔ {row.id_siswa_induk}
                          </td>
                          <td className="p-2.5">
                            {row.nama_siswa.includes('NULL') ? (
                              <span className="px-1.5 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-800 font-bold text-[10px]">
                                NULL
                              </span>
                            ) : (
                              <span className="text-slate-100 font-sans font-semibold">{row.nama_siswa}</span>
                            )}
                          </td>
                          <td className="p-2.5 text-slate-300">{row.kelas}</td>
                          <td className="p-2.5 text-right">
                            {row.status === 'matched' ? (
                              <span className="text-[10px] text-emerald-400 font-bold bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">
                                ✓ COCOK
                              </span>
                            ) : (
                              <span className="text-[10px] text-amber-400 font-bold bg-amber-950 px-2 py-0.5 rounded border border-amber-800">
                                ! KOSONG (NULL)
                              </span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>
          )}

          {/* SUBVIEW 2: NORMALIZATION WIZARD (1NF - 3NF) */}
          {subView === 'norm' && (
            <div className="bg-slate-900/95 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
                <div>
                  <h3 className="font-bold text-base text-white">Visual Wizard Normalisasi Database</h3>
                  <p className="text-xs text-slate-400 mt-1">
                    Pelajari cara mengubah tabel data yang berantakan & redundan menjadi tabel relasional yang bersih tanpa anomali.
                  </p>
                </div>

                {/* Step Indicators */}
                <div className="flex items-center gap-2">
                  {[
                    { step: 0, label: 'Mentah (UNF)' },
                    { step: 1, label: '1NF (Atomik)' },
                    { step: 2, label: '2NF (Parsial)' },
                    { step: 3, label: '3NF (Transitif)' },
                  ].map(s => (
                    <button
                      key={s.step}
                      onClick={() => { setNormStep(s.step); sfx.whoosh(); }}
                      className={`px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition border ${
                        normStep === s.step
                          ? 'bg-violet-600 text-white border-violet-400 shadow-md'
                          : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white'
                      }`}
                    >
                      {s.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Step Explanations */}
              <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-xs">
                {normStep === 0 && (
                  <div>
                    <span className="font-bold text-rose-400 text-sm">❌ Bentuk Unnormalized (UNF) - Berantakan & Redundan:</span>
                    <p className="text-slate-300 mt-1">
                      Perhatikan kolom <strong>Hobi</strong> yang berisi banyak nilai dalam 1 sel (multi-value), dan data siswa diulang-ulang setiap kali siswa mengambil mata pelajaran baru. Ini memicu Anomali Pembaruan (Update Anomaly).
                    </p>
                  </div>
                )}
                {normStep === 1 && (
                  <div>
                    <span className="font-bold text-amber-400 text-sm">⚡ Tahap 1NF (First Normal Form) - Nilai Harus Atomik:</span>
                    <p className="text-slate-300 mt-1">
                      Setiap sel sekarang hanya berisi 1 nilai tunggal (atomik). Tidak ada lagi nilai koma dalam satu sel hobi. Namun data nama dan kota siswa masih berulang (belum 2NF).
                    </p>
                  </div>
                )}
                {normStep === 2 && (
                  <div>
                    <span className="font-bold text-cyan-400 text-sm">✨ Tahap 2NF (Second Normal Form) - Hilangkan Ketergantungan Parsial:</span>
                    <p className="text-slate-300 mt-1">
                      Tabel dipecah menjadi 2 tabel: <strong>Tabel Siswa</strong> dan <strong>Tabel Nilai Siswa</strong> yang dihubungkan melalui Primary Key <strong>nisn</strong>.
                    </p>
                  </div>
                )}
                {normStep === 3 && (
                  <div>
                    <span className="font-bold text-emerald-400 text-sm">🏆 Tahap 3NF (Third Normal Form) - Bersih Sempurna dari Anomali:</span>
                    <p className="text-slate-300 mt-1">
                      Tidak ada lagi ketergantungan transitif. Informasi Kota/Kode Pos dipisahkan ke <strong>Tabel Wilayah</strong>. Struktur database siap dipakai pada sistem aplikasi profesional skala industri!
                    </p>
                  </div>
                )}
              </div>

              {/* Step Tables Demonstration */}
              {normStep === 0 && (
                <div className="overflow-x-auto border border-rose-500/30 rounded-xl bg-slate-950">
                  <table className="w-full text-left text-xs font-mono">
                    <thead>
                      <tr className="border-b border-slate-800 text-rose-300 bg-rose-950/30">
                        <th className="p-2.5">NISN</th>
                        <th className="p-2.5">Nama Siswa</th>
                        <th className="p-2.5">Hobi (Multi-Value)</th>
                        <th className="p-2.5">Mata Pelajaran</th>
                        <th className="p-2.5">Nilai</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60 text-slate-300">
                      <tr>
                        <td className="p-2.5">0071</td>
                        <td className="p-2.5">Ahmad Rizky</td>
                        <td className="p-2.5 text-rose-400 font-bold bg-rose-950/20">Coding, Futsal, Gaming</td>
                        <td className="p-2.5">Basis Data</td>
                        <td className="p-2.5">88</td>
                      </tr>
                      <tr>
                        <td className="p-2.5">0071</td>
                        <td className="p-2.5 text-slate-500">Ahmad Rizky (Duplikat)</td>
                        <td className="p-2.5 text-rose-400 font-bold bg-rose-950/20">Coding, Futsal, Gaming</td>
                        <td className="p-2.5">PBO</td>
                        <td className="p-2.5">92</td>
                      </tr>
                      <tr>
                        <td className="p-2.5">0072</td>
                        <td className="p-2.5">Siti Nurhaliza</td>
                        <td className="p-2.5 text-rose-400 font-bold bg-rose-950/20">Membaca, Robotik</td>
                        <td className="p-2.5">Basis Data</td>
                        <td className="p-2.5">94</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              )}

              {normStep === 1 && (
                <div className="overflow-x-auto border border-amber-500/30 rounded-xl bg-slate-950">
                  <table className="w-full text-left text-xs font-mono">
                    <thead>
                      <tr className="border-b border-slate-800 text-amber-300 bg-amber-950/30">
                        <th className="p-2.5">NISN (PK)</th>
                        <th className="p-2.5">Nama Siswa</th>
                        <th className="p-2.5">Hobi (1 Nilai per Sel)</th>
                        <th className="p-2.5">Mata Pelajaran</th>
                        <th className="p-2.5">Nilai</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60 text-slate-300">
                      <tr>
                        <td className="p-2.5">0071</td>
                        <td className="p-2.5">Ahmad Rizky</td>
                        <td className="p-2.5 text-emerald-400 font-semibold">Coding</td>
                        <td className="p-2.5">Basis Data</td>
                        <td className="p-2.5">88</td>
                      </tr>
                      <tr>
                        <td className="p-2.5">0071</td>
                        <td className="p-2.5">Ahmad Rizky</td>
                        <td className="p-2.5 text-emerald-400 font-semibold">Futsal</td>
                        <td className="p-2.5">Basis Data</td>
                        <td className="p-2.5">88</td>
                      </tr>
                      <tr>
                        <td className="p-2.5">0071</td>
                        <td className="p-2.5">Ahmad Rizky</td>
                        <td className="p-2.5 text-emerald-400 font-semibold">Gaming</td>
                        <td className="p-2.5">Basis Data</td>
                        <td className="p-2.5">88</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              )}

              {(normStep === 2 || normStep === 3) && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="border border-cyan-500/40 rounded-xl bg-slate-950 p-3">
                    <span className="font-bold text-cyan-400 text-xs">📋 Tabel_Siswa (Induk)</span>
                    <table className="w-full text-left text-[11px] font-mono mt-2">
                      <thead>
                        <tr className="text-slate-400 border-b border-slate-800">
                          <th className="p-1.5">NISN (PK)</th>
                          <th className="p-1.5">Nama Siswa</th>
                          <th className="p-1.5">Jurusan</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        <tr>
                          <td className="p-1.5 text-cyan-400 font-bold">0071</td>
                          <td className="p-1.5">Ahmad Rizky</td>
                          <td className="p-1.5">RPL</td>
                        </tr>
                        <tr>
                          <td className="p-1.5 text-cyan-400 font-bold">0072</td>
                          <td className="p-1.5">Siti Nurhaliza</td>
                          <td className="p-1.5">RPL</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <div className="border border-emerald-500/40 rounded-xl bg-slate-950 p-3">
                    <span className="font-bold text-emerald-400 text-xs">📊 Tabel_Nilai_Mapel (Relasi)</span>
                    <table className="w-full text-left text-[11px] font-mono mt-2">
                      <thead>
                        <tr className="text-slate-400 border-b border-slate-800">
                          <th className="p-1.5 text-cyan-400">NISN (FK)</th>
                          <th className="p-1.5">Mata Pelajaran</th>
                          <th className="p-1.5">Nilai</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        <tr>
                          <td className="p-1.5 text-cyan-400 font-bold">0071</td>
                          <td className="p-1.5">Basis Data</td>
                          <td className="p-1.5 text-emerald-400 font-bold">88</td>
                        </tr>
                        <tr>
                          <td className="p-1.5 text-cyan-400 font-bold">0071</td>
                          <td className="p-1.5">PBO</td>
                          <td className="p-1.5 text-emerald-400 font-bold">92</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* Interactive Next Button */}
              <div className="flex justify-between items-center pt-2">
                <button
                  disabled={normStep === 0}
                  onClick={() => { setNormStep(s => s - 1); sfx.click(); }}
                  className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-xs font-semibold text-slate-300 transition"
                >
                  ← Tahap Sebelumnya
                </button>
                <button
                  disabled={normStep === 3}
                  onClick={() => { setNormStep(s => s + 1); sfx.whoosh(); }}
                  className="px-5 py-2 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:brightness-110 disabled:opacity-30 text-xs font-bold text-white transition shadow-lg shadow-violet-600/30"
                >
                  {normStep === 2 ? 'Sempurnakan ke 3NF ➔' : 'Terapkan Normalisasi Selanjutnya ➔'}
                </button>
              </div>

            </div>
          )}

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DatabaseTycoonApp />);
  </script>
</body>
</html>
